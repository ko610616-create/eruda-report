<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>이루다 성장 리포트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#F8F4F0;--card:#fff;--ink:#2A2827;--muted:#7D7270;--line:#EDE3DF;--pri:#A01E2C;--pri-deep:#8E1623;--pri-soft:#F7E3E3;--rose:#B88A90;--ok:#1f9d55;--ok-soft:#e3f6ea;--warn:#e08a00;--warn-soft:#fff3dc;--bad:#d64545;--bad-soft:#fde8e8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px}
header{position:sticky;top:0;z-index:5;background:#fff;color:var(--ink);padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--pri)}
header h1{margin:0;font-size:1.02rem;flex:1;display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.02em}
header h1 img{height:24px;width:auto}
header button{background:var(--pri-soft);color:var(--pri);border:0;border-radius:8px;padding:6px 10px;font:inherit;font-size:.8rem;font-weight:700}
.hero{text-align:center;margin:6px 0 18px}
.hero .em{display:flex;align-items:center;gap:14px;justify-content:center}
.hero .em:before,.hero .em:after{content:"";flex:1;max-width:70px;height:1.5px;background:var(--pri)}
.hero img{height:64px}
.hero .en{margin-top:12px;font-size:.7rem;font-weight:600;letter-spacing:.25em;color:var(--pri)}
.hero h2{margin:4px 0 4px;font-size:1.45rem;font-weight:800;letter-spacing:-.03em}
.hero h2 em{font-style:normal;color:var(--pri)}
.hero p{margin:0;font-size:.85rem;color:var(--muted)}
.up{color:var(--ok);font-weight:700}.fitrow{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.fitrow:last-child{border-bottom:0}
.tel{color:var(--pri);font-weight:800}
main{max-width:640px;margin:0 auto;padding:14px 14px 96px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:.74rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
nav button .ic{font-size:1.25rem;line-height:1}
nav button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(20,30,60,.05)}
.card h2{margin:0 0 10px;font-size:1rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border-radius:12px;padding:12px 8px;text-align:center}
.card .stat{background:var(--bg)}
.stat b{display:block;font-size:1.35rem}
.stat span{font-size:.74rem;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.av{width:38px;height:38px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-size:.85rem}
.name{font-weight:700}
.meta{font-size:.8rem;color:var(--muted)}
input,select,textarea{width:100%;font:inherit;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:.8rem;color:var(--muted);margin:10px 0 4px}
.btn{border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:700;background:var(--pri);color:#fff;cursor:pointer;text-align:center}
.btn.ghost{background:var(--pri-soft);color:var(--pri)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:7px 10px;font-size:.85rem}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.fab{position:fixed;right:18px;bottom:78px;z-index:7;width:54px;height:54px;border-radius:50%;font-size:1.6rem;box-shadow:0 4px 12px rgba(160,30,44,.35)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:.85rem;color:var(--ink)}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:6px}
.tag.A{background:var(--ok-soft);color:var(--ok)}.tag.B{background:var(--pri-soft);color:var(--pri)}.tag.C{background:var(--bad-soft);color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:24px 10px;font-size:.9rem}
.sheet-bg{position:fixed;inset:0;background:#0006;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.note{font-size:.78rem;color:var(--muted);margin-top:8px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:10px;font-size:.85rem;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.banner{font-size:.8rem;background:var(--warn-soft);color:#7a4b00;padding:9px 11px;border-radius:10px;margin-bottom:12px;line-height:1.5}
table{width:100%;border-collapse:collapse;font-size:.85rem}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.fb{white-space:pre-wrap;line-height:1.7;font-size:.95rem}
.login{max-width:420px;margin:30px auto}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:6px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font:inherit;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px #0001}
.qrow{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}
.qrow input{padding:8px 6px;text-align:center}
.qhead{display:flex;gap:6px;font-size:.72rem;color:var(--muted);padding:4px 0}
svg text{font-family:inherit}
.hide{display:none}
.help details{border-bottom:1px solid var(--line);padding:10px 0}.help details:last-child{border-bottom:0}.help summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}.help summary:after{content:'＋';color:var(--pri)}.help details[open] summary:after{content:'－'}.help ol,.help ul{margin:8px 0 0;padding-left:1.3em;line-height:1.7;font-size:.9rem}.help li b{color:var(--pri)}.step{display:inline-block;background:var(--pri);color:#fff;border-radius:6px;font-size:.7rem;font-weight:700;padding:1px 6px;margin-right:6px;vertical-align:1px}
</style>
</head>

function fitDiff(recs,k){const rs=recs.filter(r=>hv(r,k));if(rs.length<2)return null;const a=+rs[rs.length-2][k],b=+rs[rs.length-1][k];const d=b-a;return{raw:d,better:FI[k].low?-d:d,txt:fmt(k,Math.abs(d))+FI[k].u}}
const bmi=r=>r&&r.h&&r.w?Math.round(r.w/((r.h/100)**2)*10)/10:null;
function age(b){if(!b)return'';const d=new Date(b),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;return isNaN(a)?'':a+'세'}
const digits=s=>String(s||'').replace(/\D/g,'');
const normName=s=>String(s||'').replace(/\s/g,'');
function given(name){const n=normName(name);return n.length>=3?n.slice(-2):n}
function withI(n){const c=n.charCodeAt(n.length-1);return(c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?n+'이':n}
async function parentKey(name,phone){
  const data=new TextEncoder().encode('dojo-report-v1|'+normName(name)+'|'+digits(phone));
  const h=await crypto.subtle.digest('SHA-256',data);
  return[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,40)}
const PARENT_DOMAIN='parent.example.com';
// 엑셀 읽기·쓰기 (SheetJS) — 필요할 때만 불러옴
const XLSX_URL='https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs';
let XL=null;const xl=async()=>XL||(XL=await import(XLSX_URL));
const fmtPhone=v=>{let d=digits(v);if(d.length===10&&d[0]==='1')d='0'+d; // 엑셀이 앞의 0을 지운 경우
  return d.length===11?d.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3'):d.length===10?d.replace(/(\d{3})(\d{3})(\d{4})/,'$1-$2-$3'):d};
const eduNo=v=>{const d=digits(v);return d?String(+d):''}; // 0307 = 307

const EX={run:['10m 짧게 달리기 시합 × 5회','제자리 빠르게 발 구르기 10초 × 5세트','계단 오르기 5분'],
 jump:['스쿼트 점프 10회 × 3세트','개구리 점프 놀이 10회','제자리 멀리뛰기 연습 10회'],
 situp:['윗몸일으키기 15회 × 3세트','플랭크 20~30초 × 3세트','누워서 다리 들기 10회 × 3세트'],
 moa:['줄넘기 모아뛰기 30초 × 5세트','제자리 두 발 콩콩 뛰기 1분','줄 없이 리듬 맞춰 뛰기 1분'],

function trend(recs,key,color,label){
  const rs=recs.filter(r=>has(r,key));if(rs.length<2)return`<div class="note">${label} 기록이 2번 이상 쌓이면 그래프가 보여요.</div>`;
  const vals=rs.map(r=>+r[key]);let mn=Math.min(...vals),mx=Math.max(...vals);const pd=Math.max(1,(mx-mn)*.3);mn=Math.floor(mn-pd);mx=Math.ceil(mx+pd);
  const W=320,H=150,P=30,xs=rs.map((_,i)=>P+i*(W-2*P)/(rs.length-1)),ys=vals.map(v=>H-P-(v-mn)/(mx-mn)*(H-2*P));
  let g=`<svg viewBox="0 0 ${W} ${H}">`;[mn,(mn+mx)/2,mx].forEach(v=>{const y=H-P-(v-mn)/(mx-mn)*(H-2*P);g+=`<line x1="${P}" x2="${W-P}" y1="${y}" y2="${y}" stroke="#e3e8f2"/><text x="2" y="${y+4}" font-size="9" fill="#6b7590">${Math.round(v)}</text>`});
  g+=`<polyline points="${xs.map((x,i)=>x+','+ys[i]).join(' ')}" fill="none" stroke="${color}" stroke-width="2.5"/>`;
  rs.forEach((r,i)=>{g+=`<circle cx="${xs[i]}" cy="${ys[i]}" r="4" fill="${color}"/><text x="${xs[i]}" y="${ys[i]-8}" font-size="10" text-anchor="middle">${vals[i]}</text><text x="${xs[i]}" y="${H-8}" font-size="9" text-anchor="middle" fill="#6b7590">${esc(r.date.slice(2,7).replace('-','.'))}</text>`});
  return g+'</svg>'}

// ---------- feedback (규칙 기반, 무료) ----------
function weakItems(recs){
  const f=[...recs].reverse().find(hasFit);if(!f)return[];
  const ds=FK.filter(k=>hv(f,k)).map(k=>({k,d:fitDiff(recs,k)})).filter(x=>x.d);
  if(!ds.length)return[];
  const notUp=ds.filter(x=>x.d.better<=0).map(x=>x.k);
  return(notUp.length?notUp:[ds.sort((a,b)=>a.d.better/(+f[a.k])-b.d.better/(+f[b.k]))[0].k]).slice(0,2)}
function feedback(st,recs){
  const nm=withI(given(st.name));
  const body=recs.filter(r=>has(r,'h')||has(r,'w'));
  const L=[];const last=recs[recs.length-1];
  const ym=last?`${+last.date.slice(5,7)}월`:'이번 달';
  L.push(`${nm}의 ${ym} 성장 리포트예요.`);
  if(body.length){const b=body[body.length-1],p=body[body.length-2];
    let s=`키 ${b.h??'-'}cm, 몸무게 ${b.w??'-'}kg`;
    if(p&&has(b,'h')&&has(p,'h')){const d=Math.round((b.h-p.h)*10)/10;s+=d>0?`으로 지난 측정보다 키가 ${d}cm 자랐어요.`:`이에요. 지난 측정과 키 차이는 거의 없어요. 성장은 계절마다 속도가 달라서 다음 측정도 함께 봐 주세요.`}
    else s+='이에요.';
    L.push(s)}
  const f=[...recs].reverse().find(hasFit);
  if(f){
    const ds=FK.filter(k=>hv(f,k)).map(k=>({k,d:fitDiff(recs,k)})).filter(x=>x.d);
    const up=ds.filter(x=>x.d.better>0);
    if(!ds.length)L.push('이번에 체력 측정을 했어요. 다음 측정부터 얼마나 늘었는지 비교해 드릴게요.');
    else if(up.length)L.push(`지난 측정보다 ${up.map(x=>x.k==='run'?`10m 달리기 ${x.d.txt} 단축`:`${FI[x.k].l} +${x.d.txt}`).join(', ')}! 꾸준히 늘고 있어요. 👍`);
    else L.push('이번 체력 기록은 지난번과 비슷해요. 컨디션에 따라 달라질 수 있으니 다음 측정도 함께 봐 주세요.');
    const weak=weakItems(recs);
    if(weak.length)L.push(`${weak.map(k=>FI[k].l).join('와 ')}도 다음 달에 더 늘 수 있도록, 아래 추천 운동을 집에서 주 3회 해보세요.`)}
  if(st.comment)L.push('\n사범님 한마디: '+st.comment);
  return L.join('\n')}

function reportHtml(r){
  const recs=(r.records||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const body=recs.filter(x=>has(x,'h')||has(x,'w')),b=body[body.length-1],p=body[body.length-2];
  const f=[...recs].reverse().find(hasFit);
  const d=(a,c,u)=>p&&has(b,c)&&has(p,c)?`<span class="meta">(${b[c]-p[c]>=0?'+':''}${Math.round((b[c]-p[c])*10)/10}${u})</span>`:'';
  const weak=weakItems(recs);
  const fitRows=f?FIT.filter(x=>hv(f,x.k)).map(x=>{const df=fitDiff(recs,x.k);
    const ch=!df?'<span class="meta">첫 측정</span>':df.better>0?`<span class="up">▲ ${x.low?df.txt+' 빨라짐':df.txt}</span>`:df.raw===0?'<span class="meta">지난번과 같아요</span>':`<span class="meta">지난번 ${fmt(x.k,+f[x.k]-df.raw)}${x.u}</span>`;
    return`<div class="fitrow"><div class="grow"><b>${x.l}</b></div><div style="text-align:right"><b style="font-size:1.1rem">${fmt(x.k,f[x.k])}</b> <span class="meta">${x.u}</span><br>${ch}</div></div>`}).join(''):'';
  return`<div class="card"><div class="row"><div class="av">${esc(given(r.name))}</div><div class="grow"><div class="name">${esc(r.name)}</div><div class="meta">${[r.grade,r.belt,age(r.birth)].filter(Boolean).map(esc).join(' · ')}</div></div><div class="meta">업데이트<br>${esc((r.updatedAt||'').slice(0,10))}</div></div></div>
  ${b?`<div class="stats"><div class="stat"><b>${b.h??'-'}</b><span>키 cm ${d(b,'h','cm')}</span></div><div class="stat"><b>${b.w??'-'}</b><span>몸무게 kg ${d(b,'w','kg')}</span></div><div class="stat"><b>${bmi(b)??'-'}</b><span>BMI</span></div></div>`:''}
  <div class="card"><h2>💬 이번 달 피드백</h2><div class="fb">${esc(r.feedback||'')}</div></div>
  ${f?`<div class="card"><h2>💪 체력 측정 <span class="meta">${esc(f.date)}</span></h2>${fitRows}</div>`:''}
  ${weak.length?`<div class="card" style="background:var(--pri-soft)"><h2>🏃 집에서 해보는 추천 운동 <span class="meta">주 3회</span></h2>${weak.map(k=>`<div style="margin-top:6px"><b>${FI[k].l} 키우기</b><ul style="margin:4px 0 0;padding-left:1.2em">${EX[k].map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}</div>`:''}
  ${body.length?`<div class="card"><h2>📏 키 변화 (cm)</h2>${trend(recs,'h','#A01E2C','키')}<h2 style="margin-top:14px">⚖️ 몸무게 변화 (kg)</h2>${trend(recs,'w','#8C6A6F','몸무게')}</div>`:''}
  ${recs.length?`<div class="card"><h2>📋 측정 기록</h2><table><tr><th>날짜</th><th>키</th><th>몸무게</th><th>멀리뛰기</th></tr>${[...recs].reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${x.h??'-'}</td><td>${x.w??'-'}</td><td>${hv(x,'jump')?x.jump+'cm':'-'}</td></tr>`).join('')}</table></div>`:''}

 <details open><summary><span><span class="step">매달</span>측정부터 리포트까지</span></summary><ol>
  <li><b>측정하는 날 (사범님 폰)</b> — 측정 입력 탭 → 날짜 확인 → 부 선택 → "체력 항목도 입력" 체크 → 숫자 입력 → <b>한 번에 저장</b>. 안 잰 칸은 비워 두세요.</li>
  <li><b>측정이 다 끝나면 (PC)</b> — 에듀 › 측정 데이터에서 <b>올릴 날짜 화면</b>을 열고 <b>빈문서 출력</b>으로 파일 받기 → 측정 입력 탭 맨 아래 "에듀에 올릴 엑셀 만들기"에서 그 파일 고르기 → 내려받아진 파일을 에듀 <b>엑셀파일 업로드</b>에 올리기.</li>
  <li><b>리포트 올리기</b> — 리포트 탭에서 아이별 피드백 확인 → 필요하면 <b>사범님 한마디</b> 적기 (자동 저장) → <b>리포트 올리기</b> 버튼.</li>
  <li><b>학부모 안내</b> — 리포트 탭 <b>학부모 공지 문구 복사</b> → 에듀 소식(공지)에 붙여넣기.</li></ol></details>
 <details><summary><span><span class="step">팁</span>숫자 고치기 · 지우기 · 에듀 날짜</span></summary><ul>
  <li><b>숫자 고치기</b> — 측정 입력 탭에서 <b>그 날짜</b>를 고르면 저장된 숫자가 칸에 나와요. 고쳐서 <b>한 번에 저장</b>.</li>
  <li><b>숫자 지우기</b> — 그 칸을 비우고(또는 체력은 0) <b>한 번에 저장</b>. 한 아이 칸을 모두 비우면 그날 기록이 통째로 지워져요.</li>
  <li>이미 <b>리포트를 올린 뒤</b> 고쳤다면 리포트 탭에서 <b>리포트 올리기</b>를 다시 눌러야 학부모 화면에도 바뀌어요.</li>
  <li>저장이 안 되고 "숫자를 확인해 주세요"가 뜨면 — 창에 나온 <b>아이 이름·항목</b>의 숫자를 고쳐요. (다른 부에서 넣은 숫자일 수도 있으니 <b>전체</b>를 눌러 찾기)</li>
  <li><b>에듀는 측정 날짜마다 표가 따로 있어요.</b> 빈문서는 반드시 <b>올릴 그 날짜 화면</b>에서 받으세요. 엑셀을 만들면 "○월 ○일 측정 데이터 화면에 올려야 해요"라고 크게 나와요 — 에듀 화면 맨 위 날짜와 같은지 확인!</li>
  <li>에듀에서 <b>파일 선택</b> 후 꼭 <b>엑셀파일 업로드</b> 버튼까지 눌러야 들어가요. 고르는 파일은 <b>"에듀업로드_"로 시작하는 파일</b>(빈문서 아님).</li>
  <li>한 달에 부별로 여러 날 나눠 쟀어도 괜찮아요 — 아이마다 그 달의 가장 최근 기록이 들어가요.</li></ul></details>
 <details><summary><span><span class="step">처음 1번</span>원생 명단 넣기</span></summary><ol>
  <li>에듀 PC › 원생 엑셀출력에서 <b>학생번호 · 원생이름 · 생일 · 성별 · 학년 · 부 · 부모1 전화번호</b>만 체크 → 엑셀 출력.</li>
  <li>원생 탭 › <b>에듀 원생 명단 엑셀 올리기</b> → 파일 선택 → 내용 확인 → 적용하기.</li>
  <li>신입·반 변경이 있을 때 같은 방법으로 다시 올리면 <b>바뀐 정보만</b> 고쳐져요 (중복 안 생김).</li></ol></details>
 <details><summary><span><span class="step">문의</span>학부모님이 비밀번호를 잊으셨을 때</span></summary><ol>
  <li>원생 탭 › 아이 이름 누르기 › 아래 <b>로그인 ID 복사</b>.</li>
  <li>Firebase 콘솔(console.firebase.google.com) › Authentication › 사용자 › 검색창에 붙여넣기 › 그 줄 오른쪽 ⋮ › <b>계정 삭제</b>.</li>
  <li>학부모님께 "처음 왔어요"로 비밀번호를 새로 만드시라고 안내. 리포트·기록은 그대로예요.</li>
  <li>"이미 비밀번호를 만드셨어요"가 뜨는데 본인이 만든 적 없다고 하시면 — 같은 방법으로 삭제 후 다시 만들게 해 주세요.</li></ol></details>
 <details><summary><span><span class="step">관리</span>퇴원생 · 이름/번호 변경</span></summary><ul>
  <li><b>퇴원생</b> — 한 명: 원생 탭 › 아이 이름 › 삭제 (두 번 누르기). 여러 명: 원생 탭 아래 <b>여러 명 골라서 삭제</b> › 체크 › 삭제. 기록과 학부모 리포트도 함께 지워져요. (학부모 로그인 계정은 Firebase › Authentication에서 따로 지울 수 있어요)</li>
  <li><b>이름·보호자 번호가 바뀌면</b> 로그인 ID도 바뀌어요. 저장 후 리포트를 다시 올리고, 학부모님은 "처음 왔어요"로 새로 만들어야 해요.</li>
  <li>학부모 로그인은 <b>아이 이름 + 부모1 전화번호</b>예요. 에듀에 적힌 이름 그대로(띄어쓰기는 상관없음) 넣어야 들어와져요.</li></ul></details>
 <details><summary><span><span class="step">사범님</span>계정 추가 · 폰 바탕화면에 두기</span></summary><ul>
  <li><b>사범님 계정 추가</b> — Firebase 콘솔 › Authentication › 사용자 추가(이메일·비밀번호) → Firestore › 규칙의 관리자 이메일 목록에도 추가 → 게시.</li>
  <li><b>폰 바탕화면에 아이콘 만들기</b> — 크롬/삼성 인터넷에서 이 주소(끝에 #admin) 열기 › 메뉴 › <b>홈 화면에 추가</b>.</li></ul></details>
 <details><summary><span><span class="step">주의</span>개인정보</span></summary><ul>
  <li>키·몸무게는 아이 개인정보예요. 학부모 동의를 받은 뒤 운영해 주세요.</li>
  <li>관리자 계정 비밀번호는 사범님끼리만 공유하고, 공용 PC에서는 다 쓰고 <b>로그아웃</b>해 주세요.</li>
  <li>이 리포트는 참고 자료예요. 성장 관련 진단처럼 말하지 않아요.</li></ul></details>
 <div class="note">문의·수정이 필요하면 이 사이트를 만든 파일(index.html)을 고치면 돼요. 주소는 그대로 유지돼요.</div></div>`}

  <button class="btn ghost full" id="bulk" style="margin-top:8px">📋 직접 붙여넣기</button>
  ${sel||!S.students.length?'':'<button class="btn ghost full" id="selOn" style="margin-top:8px">🗑 여러 명 골라서 삭제</button>'}
  <div class="note">에듀 › 원생 엑셀출력에서 <b>학생번호·원생이름·생일·성별·학년·부·부모1 전화번호</b>만 체크해서 받은 파일을 올리세요. 다시 올리면 바뀐 정보만 고쳐져요.<br>전체 ${S.students.length}명 · 학부모 로그인에는 <b>아이 이름</b>과 <b>보호자 번호</b>가 쓰이니 정확히 입력해 주세요.</div>
  ${sel?'':'<button class="btn fab" id="newS">＋</button>'}`}
async function deleteMany(ids){
  const list=S.students.filter(x=>ids.has(x.id));const ops=[];
  for(const s of list){ops.push(F.doc(db,'students',s.id));recsOf(s.id).forEach(r=>ops.push(F.doc(db,'records',r.id)));if(s.phone)ops.push(F.doc(db,'reports',await parentKey(s.name,s.phone)))}
  busy=true;try{for(let i=0;i<ops.length;i+=450){const b=F.writeBatch(db);ops.slice(i,i+450).forEach(d=>b.delete(d));await b.commit()}
    S.students=S.students.filter(x=>!ids.has(x.id));S.records=S.records.filter(r=>!ids.has(r.sid));S.sel=null;toast(`${list.length}명 삭제했어요`)}catch(e){console.error(e);toast('삭제하지 못했어요')}
  busy=false;renderAdmin()}

function sheet(html){const bg=document.createElement('div');bg.className='sheet-bg';bg.innerHTML=`<div class="sheet">${html}</div>`;bg.addEventListener('click',e=>{if(e.target===bg)bg.remove()});document.body.appendChild(bg);return bg}
function studentSheet(id){
  const s=S.students.find(x=>x.id===id)||{id:uid(),cls:S.cls!=='전체'?S.cls:'',belt:''};const isNew=!S.students.some(x=>x.id===id);

  <label>이름 *</label><input id="f_name" value="${esc(s.name||'')}">
  <div class="grid2"><div><label>생년월일</label><input type="date" id="f_birth" value="${esc(s.birth||'')}"></div><div><label>성별</label><select id="f_gender">${['','남','여'].map(g=>`<option ${s.gender===g?'selected':''}>${g}</option>`).join('')}</select></div></div>
  <div class="grid2"><div><label>부 (시간)</label><input id="f_cls" list="cl" value="${esc(s.cls||'')}"><datalist id="cl">${classes().map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div><div><label>띠</label><select id="f_belt">${BELTS.map(b=>`<option ${s.belt===b?'selected':''}>${b}</option>`).join('')}</select></div></div>
  <label>보호자 휴대폰 * (학부모 로그인용)</label><input id="f_phone" type="tel" value="${esc(s.phone||'')}">
  ${!isNew&&s.phone?`<div class="note" style="margin-top:12px;padding:10px;background:var(--bg);border-radius:10px"><b>🔑 학부모님이 비밀번호를 잊으셨을 때</b><br>① 아래 로그인 ID 복사 → ② Firebase 콘솔 › Authentication › 사용자에서 붙여넣어 검색 → ③ 그 줄을 삭제<br>→ 학부모님이 "처음 왔어요"로 새 비밀번호를 만들면 끝이에요. 리포트·기록은 그대로 남아요.<br><span id="f_lid" style="word-break:break-all;font-family:monospace;font-size:.75rem">계산 중…</span> <button class="btn ghost" id="f_lcopy" style="padding:4px 10px;font-size:.75rem">복사</button></div>`:''}
  <div class="row" style="margin-top:14px">${isNew?'':'<button class="btn danger" id="f_del">삭제</button>'}<button class="btn ghost grow" id="f_x">취소</button><button class="btn grow" id="f_ok">저장</button></div>`);

async function exportEdu(file,month){

    let any=false;for(const[k,c]of Object.entries(col)){if(c<0||v[k]===undefined)continue;ws[X.utils.encode_cell({r:rg.s.r+r,c:rg.s.c+c})]={t:'n',v:v[k]};any=true}

  sheet(`<h3>엑셀을 만들었어요 ✅</h3><div class="fb" style="font-size:.9rem"><b>${filled}명</b> 기록을 채운 <b>${esc(name)}</b> 파일을 내려받았어요.
이제 에듀 › 측정 데이터 › <b>엑셀파일 업로드</b>에서 이 파일을 올려 주세요.</div>
  ${dTxt?`<div class="card" style="background:var(--pri-soft);margin:12px 0 0;text-align:center"><div class="meta">이 파일은 에듀의</div><div style="font-size:1.4rem;font-weight:800;color:var(--pri)">${dTxt} 측정 데이터</div><div class="meta">화면에 올려야 해요. 날짜가 다르면 그 날짜에서 빈문서를 다시 받아 주세요.</div></div>`:''}
  ${miss.length?`<div class="banner" style="margin-top:10px">⚠️ 빈문서에 없어서 못 넣은 원생 ${miss.length}명: ${miss.slice(0,8).map(esc).join(', ')}${miss.length>8?' 외':''}<br>에듀에 등록된 이름·학생번호와 같은지 확인해 주세요.</div>`:''}

async function saveQuick(){
  qDraft();const ops=[],dels=[];let bad=0;const badMsg=[];const LAB={h:'키',w:'몸무게',...Object.fromEntries(FIT.map(f=>[f.k,f.l]))};
  document.querySelectorAll('[data-q]').forEach(el=>el.style.borderColor='');
  for(const[sid,vals]of Object.entries(S.qd||{})){
    const empty=([k,v])=>v===''||(FI[k]&&+v===0); // 빈칸·체력 0 = 안 잼(에듀 방식)
    const entries=Object.entries(vals).filter(e=>!empty(e));
    const old=S.records.find(r=>r.sid===sid&&r.date===S.qdate);if(!old&&!entries.length)continue;
    const o=old?{...old}:{id:uid(),sid,date:S.qdate};let ok=true;
    Object.entries(vals).filter(empty).forEach(([k])=>delete o[k]); // 칸을 비우고 저장하면 그 기록을 지움
    for(const[k,v]of entries){const n=+v;const lim=k==='h'?[50,220]:k==='w'?[5,150]:FI[k].lim;
      if(isNaN(n)||n<lim[0]||n>lim[1]){ok=false;const st=S.students.find(x=>x.id===sid);badMsg.push(`${st?st.name:'?'} ${LAB[k]} "${v}" (${lim[0]}~${lim[1]})`);const el=document.querySelector(`[data-q="${sid}"][data-k="${k}"]`);if(el)el.style.borderColor='var(--bad)';continue}
      o[k]=k==='h'||k==='w'?Math.round(n*10)/10:k==='run'?Math.round(n*100)/100:Math.round(n)}
    if(!ok){bad++;continue}
    if(!['h','w',...FK].some(k=>has(o,k))){if(old)dels.push(old.id);continue}
    if(JSON.stringify(o)!==JSON.stringify(old||{}))ops.push(o)}
  if(bad){sheet(`<h3>숫자를 확인해 주세요</h3><div class="fb" style="font-size:.9rem">아래 칸이 범위를 벗어나서 저장하지 않았어요. 고친 뒤 다시 저장해 주세요.\n\n${badMsg.map(m=>'• '+esc(m)).join('\n')}</div><button class="btn full" style="margin-top:14px" onclick="this.closest('.sheet-bg').remove()">확인</button>`);return}
  if(!ops.length&&!dels.length){toast('바뀐 내용이 없어요');return}
  busy=true;renderAdmin();
  try{const all=[...ops.map(o=>['set',o]),...dels.map(id=>['del',id])];
    for(let i=0;i<all.length;i+=400){const b=F.writeBatch(db);all.slice(i,i+400).forEach(([t,x])=>{if(t==='del')b.delete(F.doc(db,'records',x));else{const{id,...body}=x;b.set(F.doc(db,'records',id),body)}});await b.commit()}
    ops.forEach(o=>{const i=S.records.findIndex(r=>r.id===o.id);i>=0?S.records[i]=o:S.records.push(o)});S.records=S.records.filter(r=>!dels.includes(r.id));S.qd={};
    toast([ops.length?`${ops.length}명 저장했어요`:'',dels.length?`${dels.length}명 기록을 지웠어요`:''].filter(Boolean).join(' · '))}catch(e){console.error(e);toast('저장하지 못했어요')}
  busy=false;renderAdmin()}

$('#view').addEventListener('change',e=>{
  if(!isAdminPage())return;
  if(e.target.id==='rosterFile'&&e.target.files[0]){const f=e.target.files[0];e.target.value='';return importRoster(f)}
  if(e.target.id==='eduFile'&&e.target.files[0]){const f=e.target.files[0];e.target.value='';return exportEdu(f,$('#eduMonth').value||TODAY.slice(0,7))}
  if(e.target.id==='qDate'){qDraft();S.qd={};S.qdate=e.target.value||TODAY;renderAdmin()}
  if(e.target.id==='qFit'){qDraft();S.qfit=e.target.checked;renderAdmin()}
});
</script>
</body>
</html>
